
plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'io.rest-assured:rest-assured:6.0.1'

    testImplementation 'org.json:json:20260814'

    testImplementation 'io.cucumber:cucumber-java:8.0.4'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine:8.0.4'


    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.18.4'
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.18.4'
}

test {
    useJUnitPlatform()
}


tasks.register('cucumberCli', JavaExec) {
    group = 'verification'
    description = 'Ejecuta los escenarios de Cucumber'

    dependsOn tasks.named('testClasses')

    mainClass.set('io.cucumber.core.cli.Main')
    classpath = sourceSets.test.runtimeClasspath

    def suite = providers.gradleProperty('suite').getOrElse('@Regression')

    args(
            '--plugin', 'pretty',
            '--plugin', 'html:report/cucumber-report.html',
            '--glue', 'runner',
            '--tags', suite,
            'src/test/resources'
    )
}
